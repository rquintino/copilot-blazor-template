name: "Copilot Setup Steps"
on: workflow_dispatch

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef
      # Note: Playwright MCP is auto-configured for the Copilot cloud agent
      # (docs.github.com/en/copilot/concepts/agents/cloud-agent/mcp-and-cloud-agent),
      # so the JS Playwright CLI is not installed here. Use the MCP server for
      # ad-hoc browser interaction. The .NET E2E suite uses Microsoft.Playwright
      # (NuGet) and installs browsers via playwright.ps1 — see .github/workflows/ci.yml.
      - name: Restore and Build
        run: |
          dotnet restore
          dotnet build
      - name: Verify versions
        run: |
          dotnet --version
          node --version
          npm --version
